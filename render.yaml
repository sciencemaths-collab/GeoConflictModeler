# Render Blueprint for GeoConflictModeler
# Docs: https://render.com/docs/blueprint-spec

services:
  # ----------------------------
  # Static site (landing + docs + login + pricing)
  # ----------------------------
  - type: static
    name: geoconflictmodeler-site
    rootDir: site
    staticPublishPath: .

  # ----------------------------
  # API (accounts + Stripe + access tokens)
  # ----------------------------
  - type: web
    name: geoconflictmodeler-api
    runtime: python
    rootDir: api
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: geoconflictmodeler-db
          property: connectionString
      - key: JWT_SECRET
        sync: false
      - key: APP_TOKEN_SECRET
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_PRICE_ID
        sync: false
      - key: APP_BASE_URL
        sync: false
      - key: SITE_ORIGIN
        value: "*"
      - key: CHECKOUT_SUCCESS_URL
        sync: false
      - key: CHECKOUT_CANCEL_URL
        sync: false

  # ----------------------------
  # Streamlit app (simulation + chess)
  # ----------------------------
  - type: web
    name: geoconflictmodeler-app
    runtime: python
    rootDir: app
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run app.py --server.port $PORT --server.address 0.0.0.0
    envVars:
      # Turn on paywall when ready
      - key: GCM_REQUIRE_PAID
        value: "0"
      # Set to API base URL when enabling gate (e.g., https://api.yourdomain.com)
      - key: GCM_API_BASE_URL
        sync: false


databases:
  - name: geoconflictmodeler-db
    plan: starter
